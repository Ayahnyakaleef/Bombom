<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderful World | Memories</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fdfaf1; --sage: #8da399; --paper: #f4eee0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); font-family: 'Quicksand', sans-serif; overflow: hidden; height: 100vh; }

        /* Welcome Screen */
        #welcome {
            position: fixed; inset: 0; background: var(--bg); z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 2s ease;
        }
        #welcome h2 { font-family: 'Patrick Hand', cursive; font-size: 3.5rem; color: var(--sage); margin-bottom: 30px; }
        #start-btn {
            padding: 15px 45px; border: 2px solid var(--sage); background: transparent;
            color: var(--sage); border-radius: 50px; cursor: pointer; font-size: 1.2rem;
            transition: all 0.3s; font-weight: 500;
        }
        #start-btn:hover { background: var(--sage); color: white; }

        /* Slideshow Container */
        .container { position: relative; width: 100%; height: 100vh; display: none; justify-content: center; align-items: center; background-image: url('https://www.transparenttextures.com/patterns/felt.png'); }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 3s ease-in-out; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .slide.active { opacity: 1; }

        /* Frame Kartun Aesthetic */
        .frame {
            background: white; padding: 15px 15px 60px 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08); border-radius: 3px;
            max-width: 90%; max-height: 80vh; transform: rotate(-0.5deg);
            position: relative; border: 1px solid #eee;
        }
        .slide img {
            max-width: 100%; max-height: 65vh; display: block; border-radius: 2px;
            transform: scale(1); transition: transform 10s linear;
        }
        .slide.active img { transform: scale(1.08); } /* Efek Zoom Pelan */

        .caption {
            position: absolute; bottom: 15px; left: 0; width: 100%; text-align: center;
            font-family: 'Patrick Hand', cursive; font-size: 1.8rem; color: #a1a1a1;
        }

        /* Dekorasi Awan */
        .cloud { position: absolute; opacity: 0.3; z-index: -1; animation: move 25s infinite linear; }
        @keyframes move { from { left: -150px; } to { left: 100%; } }

        #yt-player { position: absolute; top: -100px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="welcome">
        <h2>Dunia Kecil Kita</h2>
        <button id="start-btn">Lihat Kenangan</button>
    </div>

    <div id="yt-player"></div>

    <div class="container" id="content">
        <img src="https://www.freeiconspng.com/uploads/cloud-icon-png-25.png" class="cloud" style="top:10%; width:120px;">
        <img src="https://www.freeiconspng.com/uploads/cloud-icon-png-25.png" class="cloud" style="top:25%; animation-delay:-7s; width:180px;">

        <div class="slide active"><div class="frame"><img src="https://i.postimg.cc/FzyH1LMv/85e6a1f8-e3a5-4d65-8a0f-3b427363ed76-20260511-214641-0000.jpg"><div class="caption">Wonderful World..</div></div></div>
        <div class="slide"><div class="frame" style="transform:rotate(1deg)"><img src="https://i.postimg.cc/k52MKZ0c/IMG-20260511-WA0018.jpg"><div class="caption">Anugerah Terindah</div></div></div>
        <div class="slide"><div class="frame"><img src="https://i.postimg.cc/qvRpHSv0/IMG-20260511-WA0014.jpg"></div></div>
        <div class="slide"><div class="frame" style="transform:rotate(-1deg)"><img src="https://i.postimg.cc/d3wKHSxp/IMG-20260511-WA0017.jpg"></div></div>
        <div class="slide"><div class="frame"><img src="https://i.postimg.cc/t4YGM6B6/IMG-20260511-WA0015.jpg"></div></div>
        <div class="slide"><div class="frame"><img src="https://i.postimg.cc/ZnVXfY3w/IMG-20260511-WA0016.jpg"></div></div>
        <div class="slide"><div class="frame" style="transform:rotate(1.5deg)"><img src="https://i.postimg.cc/bJR5JY6y/IMG-20260511-WA0013.jpg"></div></div>
        <div class="slide"><div class="frame"><img src="https://i.postimg.cc/25R97LJs/IMG-20260511-WA0010.jpg"></div></div>
        <div class="slide"><div class="frame"><img src="https://i.postimg.cc/DwsB0yZt/IMG-20260511-WA0011.jpg"></div></div>
        <div class="slide"><div class="frame" style="transform:rotate(-1deg)"><img src="https://i.postimg.cc/Nf2xCf1t/IMG-20260511-WA0009.jpg"></div></div>
        <div class="slide"><div class="frame"><img src="https://i.postimg.cc/br71fkQY/IMG-20260511-WA0008.jpg"></div></div>
        <div class="slide"><div class="frame"><img src="https://i.postimg.cc/R0SKmMnP/IMG-20260511-WA0007.jpg"></div></div>
        <div class="slide"><div class="frame" style="transform:rotate(1deg)"><img src="https://i.postimg.cc/Kz4TKJfh/IMG-20260511-WA0005.jpg"></div></div>
        <div class="slide"><div class="frame"><img src="https://i.postimg.cc/jSXM0qSM/IMG-20260511-WA0003(1).jpg"></div></div>
        <div class="slide"><div class="frame"><img src="https://i.postimg.cc/ydShd77K/IMG-20260511-WA0000.jpg"></div></div>
        <div class="slide"><div class="frame" style="transform:rotate(-1.5deg)"><img src="https://i.postimg.cc/BnQxFTq3/IMG-20260511-WA0002.jpg"></div></div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0',
                videoId: 'CWzrABouyeE', // Instrumental What a Wonderful World
                playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'CWzrABouyeE' },
                events: { 'onReady': function() {
                    document.getElementById('start-btn').onclick = function() {
                        document.getElementById('welcome').style.opacity = '0';
                        setTimeout(() => {
                            document.getElementById('welcome').style.display = 'none';
                            document.getElementById('content').style.display = 'flex';
                        }, 2000);
                        player.playVideo();
                        startSlides();
                    };
                }}
            });
        }

        function startSlides() {
            let current = 0;
            const slides = document.querySelectorAll('.slide');
            setInterval(() => {
                slides[current].classList.remove('active');
                current = (current + 1) % slides.length;
                slides[current].classList.add('active');
            }, 10000); // 10 Detik sesuai request
        }
    </script>
</body>
</html>
